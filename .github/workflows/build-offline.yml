name: Build Labs Offline APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Kotlin ka version. Build me "Kotlin metadata" jaisa error aaye to isko 2.2.20 ya 2.4.0 karke dekho.
      KOTLIN_VERSION: "2.3.20"
    steps:
      - name: Code lo
        uses: actions/checkout@v4

      - name: Node lagao
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Java lagao
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fixed signing key lagao
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Python lagao
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Web folder banao
        run: |
          mkdir -p www
          # sabse bada version wali labs-offline-vN.html lo, na ho to index.html
          FILE=$(ls labs-offline-v*.html 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$FILE" ]; then FILE=index.html; fi
          echo "App file: $FILE"
          cp "$FILE" www/index.html

      - name: Signing key ka fingerprint dikhao
        run: |
          keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null | grep -E "Alias name|SHA256" || true

      - name: Packages install karo
        run: npm install

      - name: Android project banao
        run: npx cap add android

      - name: Plugin file chuno
        run: |
          # sabse bada version wali LabsLlmPlugin-vN.kt lo, na ho to LabsLlmPlugin.kt
          P=$(ls LabsLlmPlugin-v*.kt 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$P" ]; then cp "$P" LabsLlmPlugin.kt; fi
          echo "Plugin file: ${P:-LabsLlmPlugin.kt}"

      - name: Phone-AI wala hissa jodo
        run: python setup_android.py

      - name: Version number badhao
        run: |
          N=${{ github.run_number }}
          sed -i -E "s/versionCode[[:space:]]*=?[[:space:]]*[0-9]+/versionCode $N/; s/versionName[[:space:]]*=?[[:space:]]*\"[^\"]*\"/versionName \"1.$N\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Icon banao
        run: |
          pip install pillow
          python make_icons.py

      - name: Web files sync karo
        run: npx cap sync android

      - name: Gradle files ka haal dikhao
        run: |
          echo "===== android/build.gradle ====="
          cat android/build.gradle
          echo "===== android/app/build.gradle (aakhri hissa) ====="
          tail -n 60 android/app/build.gradle

      - name: Debug APK build karo
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK ka signature dikhao
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          "$AS" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk 2>&1 | grep -E "SHA-256" || true

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: Labs-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
